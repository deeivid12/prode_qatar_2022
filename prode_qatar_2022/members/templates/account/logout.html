{% extends 'tournaments/base.html' %}

{% block title %}
<title>Cerrar Sesión</title>
{% endblock %}

{% block content %}
<div class="row">
	<div class="col mt-2 mb-4">
		<h5>¿Cerrar sesión?</h5>
		<form method="post" action="{% url 'account_logout' %}">
			{% csrf_token %}
			<button type="submit" class="btn btn-dark">Cerrar Sesión</button>
		</form>
	</div>
</div>
{% endblock %}
