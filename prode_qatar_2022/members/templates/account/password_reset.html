{% extends 'tournaments/base.html' %}

{% block title %}
<title>Recuperar Password</title>
{% endblock %}

{% block content %}
<div class="row">
	<div class="col mt-2 mb-4">
		<h5>Recuperar Password</h5>
	</div>
</div>
<div class="row">
	<div class="col-8 col-sm-6 col-md-4 col-lg-3 col-xl-2 mx-auto form-group">
		<form method="post" action="{% url 'account_reset_password' %}">
			{% csrf_token %}
			<div class="form-outline mb-2">
			  <input type="email" name="email" id="email" required class="form-control mb-2" />
			  <label class="form-label" for="email">Email</label>
			</div>
			<button type="submit" class="btn btn-dark btn-block mb-4">Enviar</button>
		</form>
	</div>
</div>
{% endblock %}
