{% extends 'tournaments/base.html' %}

{% block title %}
<title>Nueva Password</title>
{% endblock %}

{% block content %}
<div class="row">
	<div class="col mt-2 mb-4">
		<h5>Nueva Password</h5>
	</div>
</div>
<div class="row">
	<div class="col-8 col-sm-6 col-md-4 col-lg-3 col-xl-2 mx-auto form-group">
		{% if token_fail %}
			<p>El link es inválido o expiró. <a href="{% url 'account_reset_password' %}">Solicitá uno nuevo.</a></p>
		{% else %}
			<form method="post" action="{{ action_url }}">
				{% csrf_token %}
				<div class="form-outline mb-2">
				  <input type="password" name="password1" id="id_password1" required class="form-control mb-2" />
				  <label class="form-label" for="id_password1">Password Nueva</label>
				</div>
				<div class="form-outline mb-2">
				  <input type="password" name="password2" id="id_password2" required class="form-control mb-2" />
				  <label class="form-label" for="id_password2">Confirmar Password</label>
				</div>
				<button type="submit" class="btn btn-dark btn-block mb-4">Guardar</button>
			</form>
		{% endif %}
	</div>
</div>
{% endblock %}
