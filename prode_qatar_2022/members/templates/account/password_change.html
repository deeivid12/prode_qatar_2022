{% extends 'tournaments/base.html' %}

{% block title %}
<title>Cambio de Password</title>
{% endblock %}

{% block content %}
<div class="row">
	<div class="col mt-2 mb-4">
		<h5>Cambio de Password</h5>
	</div>
</div>
<div class="row">
	<div class="col-8 col-sm-6 col-md-4 col-lg-3 col-xl-2 mx-auto form-group">
		<form method="post" action="{% url 'account_change_password' %}">
			{% csrf_token %}
			<div class="form-outline mb-2">
				<input type="password" name="oldpassword" id="id_oldpassword" required class="form-control mb-2" />
				<label class="form-label" for="id_oldpassword">Password Anterior</label>
			</div>

			<div class="form-outline mb-2">
			  <input type="password" name="password1" id="id_password1" required class="form-control mb-2" />
			  <label class="form-label" for="id_new_password1">Password Nueva</label>
			  <br>
			  <small class="form-text text-muted">
				Su nueva password debe contener como mínimo 6 caracteres.
			  </small>
			</div>

			<div class="form-outline mb-2">
				<input type="password" name="password2" id="id_password2" required class="form-control mb-2" />
				<label class="form-label" for="id_new_password2">Confirmar Password</label>
				<br>
				<small class="form-text text-muted">
				Debe coincidir con su nueva password.
				</small>
			</div>

			<button type="submit" class="btn btn-dark btn-block mb-4">Guardar</button>
		</form>
	</div>
</div>
{% endblock %}
